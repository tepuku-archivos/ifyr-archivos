name: Supabase keep-alive

# Mantiene vivo el proyecto Supabase del sitio fiscales-religiosos.tepuku.org
# (plan Free: se pausa tras ~7 dias de inactividad).
#
# Leccion del incidente 2026-08-19/26: la version anterior solo hacia ping.
# Cuando el proyecto se cayo igual, el ping no pudo hacer nada y fallo en
# silencio tres corridas seguidas hasta que el sitio aparecio roto. Esta
# version:
#   1. pinguea a diario (no cada 3 dias: dos corridas perdidas ya son la pausa)
#   2. si el ping falla, intenta RESTAURAR el proyecto via Management API
#   3. si aun asi no levanta, abre un issue para que alguien se entere
#
# Requiere el secret SUPABASE_ACCESS_TOKEN (Personal Access Token de
# https://supabase.com/dashboard/account/tokens). Sin el, el paso de
# restauracion se salta y el workflow se comporta como la version vieja.

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

env:
  PROJECT_REF: xrbqtjrqvpkplbymmdad
  SUPABASE_URL: https://xrbqtjrqvpkplbymmdad.supabase.co
  ANON_KEY: sb_publishable_7HpzJkZxTTjISGWi82pKNw_PPC-L5ug
  # select=* y no una columna concreta: la vista puede cambiar de esquema y el
  # canario no debe romperse por eso (con select=id daba 400, la PK es
  # id_proyecto). limit=1 mantiene la respuesta minima.
  CONSULTA: /rest/v1/inmuebles_publico?select=*&limit=1

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Consultar Supabase
        id: ping
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SUPABASE_URL$CONSULTA" -H "apikey: $ANON_KEY")
          echo "Respuesta HTTP: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

          # "Vivo" no es lo mismo que "200". Un 4xx significa que PostgREST
          # contesto: la base esta levantada y la consulta es la que esta mal.
          # Pedir una restauracion en ese caso seria un falso positivo.
          # Caido de verdad = sin respuesta (000) o error del servidor (5xx).
          if [ "$STATUS" = "000" ] || [ "$STATUS" -ge 500 ] 2>/dev/null; then
            echo "alive=no" >> "$GITHUB_OUTPUT"
          else
            echo "alive=yes" >> "$GITHUB_OUTPUT"
            if [ "$STATUS" != "200" ]; then
              echo "::warning::Supabase respondio HTTP $STATUS: la base esta viva pero la consulta del canario fallo. Revisar si cambio el esquema de inmuebles_publico."
            fi
          fi

      - name: Intentar restaurar el proyecto
        id: restore
        if: steps.ping.outputs.alive != 'yes'
        env:
          SB_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PING_STATUS: ${{ steps.ping.outputs.status }}
        run: |
          if [ -z "$SB_TOKEN" ]; then
            echo "::warning::Ping fallo (HTTP $PING_STATUS) y no hay SUPABASE_ACCESS_TOKEN configurado. No puedo restaurar."
            echo "recovered=no-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Ping fallo (HTTP $PING_STATUS). Pidiendo restauracion..."
          CODE=$(curl -s -o /tmp/restore.txt -w '%{http_code}' --max-time 60 -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" -H "Authorization: Bearer $SB_TOKEN" -H "Content-Type: application/json" -d '{}')
          echo "Management API respondio HTTP $CODE"
          cat /tmp/restore.txt || true
          if [ "$CODE" = "401" ] || [ "$CODE" = "403" ]; then
            echo "::error::La Management API rechazo el token (HTTP $CODE). Lo mas probable es que SUPABASE_ACCESS_TOKEN haya vencido o fuera revocado. Renovarlo en https://supabase.com/dashboard/account/tokens y actualizar el secret del repo."
            echo "recovered=bad-token" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # La restauracion tarda unos minutos: reintentar hasta 10.
          for i in $(seq 1 20); do
            sleep 30
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$SUPABASE_URL$CONSULTA" -H "apikey: $ANON_KEY")
            echo "  intento $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "recovered=yes" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "recovered=no" >> "$GITHUB_OUTPUT"

      - name: Registrar en log y commit
        if: always() && steps.ping.conclusion == 'success'
        env:
          PING_STATUS: ${{ steps.ping.outputs.status }}
          RECOVERED: ${{ steps.restore.outputs.recovered }}
          ALIVE: ${{ steps.ping.outputs.alive }}
        run: |
          if [ "$ALIVE" = "yes" ] && [ "$PING_STATUS" = "200" ]; then
            LINE="ping OK"
          elif [ "$ALIVE" = "yes" ]; then
            LINE="vivo pero consulta con HTTP $PING_STATUS (revisar esquema)"
          elif [ "$RECOVERED" = "yes" ]; then
            LINE="ping HTTP $PING_STATUS -> RESTAURADO por el workflow"
          elif [ "$RECOVERED" = "no-token" ]; then
            LINE="ping HTTP $PING_STATUS -> FALLO (sin SUPABASE_ACCESS_TOKEN)"
          elif [ "$RECOVERED" = "bad-token" ]; then
            LINE="ping HTTP $PING_STATUS -> FALLO (SUPABASE_ACCESS_TOKEN vencido o revocado)"
          else
            LINE="ping HTTP $PING_STATUS -> FALLO, restauracion sin exito"
          fi
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') $LINE" >> keepalive.log
          tail -n 60 keepalive.log > keepalive.tmp && mv keepalive.tmp keepalive.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.log
          git diff --staged --quiet || git commit -m "keep-alive: $LINE"
          git push

      - name: Avisar si el sitio sigue caido
        if: steps.ping.outputs.alive != 'yes' && steps.restore.outputs.recovered != 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
          PING_STATUS: ${{ steps.ping.outputs.status }}
        run: |
          # El label puede no existir todavia; --force lo crea o lo deja igual.
          gh label create keepalive --description "Avisos del keep-alive de Supabase" --color B60205 --force || true
          ABIERTOS=$(gh issue list --label keepalive --state open --json number --jq 'length')
          if [ "$ABIERTOS" != "0" ]; then
            echo "Ya hay un issue abierto con label keepalive. No abro otro."
            exit 0
          fi
          printf '%s\n' \
            "El keep-alive no pudo contactar Supabase (HTTP $PING_STATUS) ni restaurar el proyecto automaticamente." \
            "" \
            "**Efecto visible:** fiscales-religiosos.tepuku.org carga, pero sin fotos y con el mapa sin marcadores. Los documentos y los textos si se ven, porque estan hardcoded en Lovable y no tocan Supabase." \
            "" \
            "**Que hacer:** entrar a https://supabase.com/dashboard/project/$PROJECT_REF y reanudar el proyecto (Restore / Resume)." \
            "" \
            "Corrida: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > /tmp/issue.md
          gh issue create --label keepalive --title "Supabase caido: el sitio IFYR esta sin datos" --body-file /tmp/issue.md

      - name: Fallar si no se recupero
        if: steps.ping.outputs.alive != 'yes' && steps.restore.outputs.recovered != 'yes'
        run: exit 1
